services:
  stats-api:
    image: ple002/educloud-stats-api:v3
    ports:
      - "8002:8000"
    environment:
      - DB_HOST=host.docker.internal
    #  - DB_PORT=5432   # Use this port if your local PostgreSQL instance is running on port 5432
      - DB_PORT=5434
      - DB_NAME=moodle
      - DB_USER=moodle
      - DB_PASSWORD=moodle_password
      - ASSISTANT_URL=http://host.docker.internal:3001
    #  - ASSISTANT_URL=http://10.3.16.187:3000   # Use 3000 in server university
      - ASSISTANT_API_KEY=${ASSISTANT_API_KEY}
      - LLM_BASE_URL=http://host.docker.internal:3001/api
    #  - LLM_BASE_URL=http://10.3.16.187:3000/api   # Use 3000 in server university
      - LLM_API_KEY=${ASSISTANT_API_KEY}
      - LLM_MODEL=models/gemini-3.5-flash
      - NO_PROXY=open-webui,postgres,localhost,127.0.0.1
      - no_proxy=open-webui,postgres,localhost,127.0.0.1

      # Swarm ne lit pas le fichier .env : charger les variables avant de déployer
      # Sinon, utilise:  set -a && source .env && set +a
      #- LLM_API_KEY=sk-e9c----
      #- ASSISTANT_API_KEY=sk-e9c----
                                                           
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
