# Pile Swarm "swarmdemo" : nginx (point d'entrée, port 8002) + stats-api (3 réplicas).
#
# Le même fichier sert en local et sur le serveur de l'université :
#   - sur le serveur, les valeurs par défaut ci-dessous s'appliquent ;
#   - en local, les variables SWARM_* du fichier .env les remplacent (voir .env.example).
#
# Avant de déployer (Swarm ne lit pas .env tout seul) :
#   set -a && source .env && set +a
#   docker node update --label-add educloud=api $(docker info -f '{{.Swarm.NodeID}}')
#   fichier nginx-htpasswd présent (mot de passe du tableau de bord, voir « secrets » en bas)
#   docker stack deploy -c docker-stack-stats.yml swarmdemo

services:
  nginx:
    image: nginx:1.27-alpine
    # Mode host : le serveur est un conteneur LXC, où le routage ingress (IPVS) est impossible
    ports:
      - target: 80
        published: 8002
        protocol: tcp
        mode: host
    configs:
      - source: nginx_conf_v3
        target: /etc/nginx/conf.d/default.conf
    # Mot de passe du tableau de bord (fichier nginx-htpasswd, jamais versionné)
    secrets:
      - source: nginx_htpasswd_v1
        target: nginx_htpasswd
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  stats-api:
    image: ple002/educloud-stats-api:v3
    environment:
      - DB_HOST=${SWARM_DB_HOST:-10.3.16.187}
      - DB_PORT=${SWARM_DB_PORT:-5432}
      - DB_NAME=moodle
      - DB_USER=moodle
      - DB_PASSWORD=moodle_password
      - ASSISTANT_URL=${SWARM_ASSISTANT_URL:-http://10.3.16.187:3000}
      - ASSISTANT_API_KEY=${ASSISTANT_API_KEY}
      - LLM_BASE_URL=https://api.groq.com/openai/v1
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=qwen/qwen3.8-27b
      # Proxy de l'université pour les appels HTTPS sortants (Groq) ; SWARM_HTTPS_PROXY vide = pas de proxy
      - HTTPS_PROXY=${SWARM_HTTPS_PROXY-http://cache.univ-pau.fr:3128}
      - https_proxy=${SWARM_HTTPS_PROXY-http://cache.univ-pau.fr:3128}
      - NO_PROXY=10.3.16.187,host.docker.internal,open-webui,postgres,localhost,127.0.0.1
      - no_proxy=10.3.16.187,host.docker.internal,open-webui,postgres,localhost,127.0.0.1
    # L'image est basée sur python:3.10-slim : pas de curl, on utilise python3
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    deploy:
      # dnsrr : le DNS de Swarm renvoie l'adresse de chaque réplica (pas d'IPVS) ; nginx répartit
      endpoint_mode: dnsrr
      replicas: 3
      placement:
        # Seuls les nœuds étiquetés educloud=api reçoivent des réplicas
        constraints:
          - node.labels.educloud == api
        # Au plus 4 réplicas par nœud : les 3 réplicas + 1 place pour order: start-first
        # (pendant une mise à jour, le nouveau réplica démarre avant l'arrêt de l'ancien)
        max_replicas_per_node: 4
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

configs:
  # Une config Swarm est immuable : changer de nom (v3, v4…) à chaque modification de nginx-stats.conf
  nginx_conf_v3:
    file: ./nginx-stats.conf

secrets:
  # Créer avec : printf 'admin:%s\n' "$(openssl passwd -apr1 "$STATS_ADMIN_PASSWORD")" > nginx-htpasswd
  # Un secret Swarm est immuable : après un changement de mot de passe, passer à _v2, _v3…
  nginx_htpasswd_v1:
    file: ./nginx-htpasswd
