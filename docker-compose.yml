# EduCloud — socle applicatif (Moodle, PostgreSQL, Open WebUI, sync-moodle).
#
# Le fichier est prêt pour une machine de développement.
#   LOCAL   : la ligne est active, laissez-la telle quelle.
#   SERVEUR : décommentez la ligne et commentez la ligne LOCAL correspondante.
#
# stats-api n'est pas ici : il est déployé par Docker Swarm (docker-stack-stats.yml).

services:
  postgres:
    image: postgres:16
    container_name: educloud-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"     # LOCAL   : 5434 évite un PostgreSQL déjà installé sur la machine
    # - "5432:5432"     # SERVEUR : port standard
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
  moodle:
    build:                                         # ajout Phuong
      context: .                                   # ajout Phuong
#      args:                                        # SERVEUR : proxy de l'université
#        http_proxy: http://cache.univ-pau.fr:3128  # SERVEUR
#        https_proxy: http://cache.univ-pau.fr:3128 # SERVEUR
    image: educloud-moodle:4.5.14
    container_name: educloud-moodle
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - postgres
    environment:
      MOODLE_DB_TYPE: pgsql
      MOODLE_DB_HOST: postgres
      MOODLE_DB_PORT: 5432
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: moodle_password
      MOODLE_URL: http://localhost:8080              # LOCAL
#      MOODLE_URL: http://10.3.16.187:8080           # SERVEUR
      STATS_API_URL: http://host.docker.internal:8002 # LOCAL   : adresse de stats-api vue par la page « Abonnement »
#      STATS_API_URL: http://10.3.16.187:8002        # SERVEUR


    volumes:
      - moodle_data:/moodledata

  # ===== DÉBUT AJOUT PHUONG =====
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3001:8080"     # LOCAL
    # - "3000:8080"     # SERVEUR
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
#      - HTTPS_PROXY=http://cache.univ-pau.fr:3128  # SERVEUR : proxy de l'université
#      - https_proxy=http://cache.univ-pau.fr:3128   # SERVEUR
#      - RAG_EMBEDDING_ENGINE=openai                 # SERVEUR : le proxy bloque le modèle d'indexation par défaut
#      - RAG_EMBEDDING_MODEL=models/gemini-embedding-001  # SERVEUR
    restart: always

  quiz-api:
    build: 
      context: ./quiz-api
#      args:                                        # SERVEUR : proxy de l'université
#        http_proxy: http://cache.univ-pau.fr:3128  # SERVEUR
#        https_proxy: http://cache.univ-pau.fr:3128 # SERVEUR
    ports:
      - "8001:8000"
    environment:
      - ASSISTANT_URL=http://open-webui:8080
      - ASSISTANT_API_KEY=${ASSISTANT_API_KEY}
      - NO_PROXY=open-webui,localhost,127.0.0.1
      - no_proxy=open-webui,localhost,127.0.0.1
    depends_on:
      - open-webui
    restart: always

  sync-moodle:
    build:
      context: ./sync-moodle
#      args:                                        # SERVEUR : proxy de l'université
#        http_proxy: http://cache.univ-pau.fr:3128  # SERVEUR
#        https_proxy: http://cache.univ-pau.fr:3128 # SERVEUR
    environment:
      - DB_HOST=postgres
      - DB_NAME=moodle
      - DB_USER=moodle
      - DB_PASSWORD=moodle_password
      - ASSISTANT_URL=http://open-webui:8080
      - ASSISTANT_API_KEY=${ASSISTANT_API_KEY}
      - MOODLE_DATA=/moodledata
      - SYNC_INTERVAL=86400  # 24 hours in seconds #Change this value to adjust the sync interval in demo
      - NO_PROXY=open-webui,postgres,localhost,127.0.0.1
      - no_proxy=open-webui,postgres,localhost,127.0.0.1
    volumes:
      - moodle_data:/moodledata:ro
    depends_on:
      - postgres
      - open-webui
    restart: always

  # ===== FIN AJOUT PHUONG =====


  # stats-api n'est PAS lancé par Compose : il tourne dans Docker Swarm, derrière nginx,
  # sur le port 8002 (voir docker-stack-stats.yml). Laisser ce bloc commenté : décommenté,
  # il prendrait le port 8002 à nginx (« port is already allocated »).
  # Il n'est conservé que pour montrer la version d'avant la mise en place de Swarm.
#   stats-api:
#     build:
#       context: ./stats-api
# #      args:
# #        http_proxy: http://cache.univ-pau.fr:3128
# #        https_proxy: http://cache.univ-pau.fr:3128
#     ports:
#       - "8002:8000"
#     environment:
#       - PYTHONUNBUFFERED=1
#       - DB_HOST=postgres
#       - DB_PORT=5432
#       - DB_NAME=moodle
#       - DB_USER=moodle
#       - DB_PASSWORD=moodle_password
#       - ASSISTANT_URL=http://open-webui:8080
#       - ASSISTANT_API_KEY=${ASSISTANT_API_KEY}
#       - LLM_BASE_URL=http://open-webui:8080/api
#       - LLM_API_KEY=${ASSISTANT_API_KEY}
#       - LLM_MODEL=models/gemma-4-26b-a4b-it
#       - NO_PROXY=open-webui,postgres,localhost,127.0.0.1
#       - no_proxy=open-webui,postgres,localhost,127.0.0.1
#     depends_on:
#       - postgres
#       - open-webui
#     restart: always

  # ===== FIN AJOUT MOHAMMED =====

volumes:
  postgres_data:
  moodle_data:
  open-webui:                                      # ajout Phuong
