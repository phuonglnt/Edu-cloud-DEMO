# Point d'entrée de stats-api (pile Swarm "swarmdemo"), publié sur le port 8002.
# Ce fichier est inclus dans le bloc http de nginx (conf.d).

# Journal : réplica choisi (upstream) et statut, pour vérifier la répartition et les reprises
log_format upstream_log '$remote_addr "$request" $status upstream=$upstream_addr ustatus=$upstream_status rt=$request_time';

# DNS interne de Docker ; en mode dnsrr, il renvoie l'adresse de chaque réplica sain
resolver 127.0.0.11 valid=5s ipv6=off;

# Appelants internes : le serveur lui-même et ses conteneurs (page « Abonnement » de Moodle,
# filtre d'Open WebUI). Les postes des utilisateurs (campus, VPN) n'en font pas partie.
geo $appel_interne {
    default          0;
    127.0.0.1        1;
    10.3.16.187      1;   # SERVEUR : le serveur de l'université
    172.16.0.0/12    1;   # réseaux des conteneurs Docker
    192.168.65.0/24  1;   # LOCAL : Docker Desktop
}

upstream stats_api {
    zone stats_api 64k;
    # resolve      : nginx suit les ajouts, retraits et remplacements de réplicas
    # max_fails=1  : un réplica qui échoue est écarté de la répartition...
    # fail_timeout : ... pendant 15 s, puis retenté
    server stats-api:8000 resolve max_fails=1 fail_timeout=15s;
}

server {
    listen 80;
    access_log /dev/stdout upstream_log;

    # Sonde de santé : délais courts, pour basculer vite vers un autre réplica
    location = /health {
        proxy_pass http://stats_api;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }

    # Niveau et paiement : appelés uniquement par Moodle et le filtre, depuis le serveur.
    # Sinon n'importe quel poste pourrait passer en GOLD sans passer par Moodle.
    location ^~ /api/subscription/ {
        if ($appel_interne = 0) { return 403; }
        proxy_pass http://stats_api;
        proxy_connect_timeout 1s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }
    location = /api/upgrade {
        if ($appel_interne = 0) { return 403; }
        proxy_pass http://stats_api;
        proxy_connect_timeout 1s;
        proxy_read_timeout 60s;
    }

    # Tableau de bord, bilan IA, tuteur, documentation : réservés à l'administrateur
    location / {
        auth_basic "Tableau de bord EduCloud - administrateur";
        auth_basic_user_file /run/secrets/nginx_htpasswd;
        proxy_pass http://stats_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 1s;
        proxy_read_timeout 60s;
        # Les requêtes POST (paiement) ne sont jamais rejouées sur un autre réplica
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }
}
